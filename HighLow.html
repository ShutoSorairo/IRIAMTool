<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ハイアンドロー</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="HighLow.css">
</head>
<body>
    <div class="container">
        <a href="index.html" class="home-btn">ホームへ</a>
        <h1 class="title">ハイアンドロー</h1>

        <div class="stats">
            <div class="stat"><span class="stat-label">連勝</span><span id="streak" class="stat-value">0</span></div>
            <div class="stat"><span class="stat-label">最高記録</span><span id="best" class="stat-value">0</span></div>
            <div class="stat"><span class="stat-label">残り山札</span><span id="remain" class="stat-value">52</span></div>
        </div>

        <div class="table-area">
            <div class="slot">
                <div class="slot-label">いまのカード</div>
                <div id="currentCard" class="card"></div>
            </div>
            <div class="vs">→</div>
            <div class="slot">
                <div class="slot-label">次のカード</div>
                <div id="nextCard" class="card back"></div>
            </div>
        </div>

        <div id="message" class="message">HIGH か LOW を選んでね</div>

        <div class="choice-btns">
            <button id="highBtn" class="choice-btn high">▲ HIGH</button>
            <button id="lowBtn" class="choice-btn low">▼ LOW</button>
        </div>
        <button id="resetBtn" class="sub-btn">最初からやり直す</button>

        <div class="options">
            <label>同じ数字のとき：
                <select id="tieRule">
                    <option value="draw">引き分け（連勝そのまま）</option>
                    <option value="win">セーフ（勝ち扱い）</option>
                    <option value="lose">アウト（負け扱い）</option>
                </select>
            </label>
            <label><input type="checkbox" id="aceHigh"> A を最強（14）にする</label>
        </div>

        <div class="history-box">
            <div class="history-label">履歴</div>
            <div id="history" class="history"></div>
        </div>
    </div>
    <script src="HighLow.js"></script>
    <script src="userbar.js"></script>
</body>
</html>
